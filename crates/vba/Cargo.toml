[package]
name = "wordcraft-vba"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft's bounded VBA-to-document bridge"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
vba-foreign = { workspace = true }
vba-ide = { workspace = true }
vba-values = { workspace = true }
vba-runtime = { git = "https://github.com/matt123p/tiny-vba", rev = "38578095ba1fc1ae3695f92a6c2e89cdb29d42f6" }
vba-vm = { git = "https://github.com/matt123p/tiny-vba", rev = "38578095ba1fc1ae3695f92a6c2e89cdb29d42f6" }
vba-project = { git = "https://github.com/matt123p/tiny-vba", rev = "38578095ba1fc1ae3695f92a6c2e89cdb29d42f6" }

[dev-dependencies]
wordcraft-docx = { workspace = true }
cfb = "=0.14.0"
web-time = { workspace = true }
zip = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
